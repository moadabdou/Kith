name: kith

services:
  postgres:
    image: postgres:17-alpine
    command: postgres -c max_connections=150 -c shared_buffers=512MB -c effective_cache_size=1536MB -c maintenance_work_mem=128MB -c work_mem=16MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kith_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kith_prod}
      POSTGRES_DB: ${POSTGRES_DB:-kith_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1024M

  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - -path
      - /migrations
      - -database
      - postgres://${POSTGRES_USER:-kith_prod}:${POSTGRES_PASSWORD:-kith_prod}@postgres:5432/${POSTGRES_DB:-kith_prod}?sslmode=disable
      - up
    volumes:
      - ./api/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 384M

  nats:
    image: nats:2.10-alpine
    command: ["--js", "-m", "8222"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 384M

  scylla:
    image: scylladb/scylla:6.2
    command: --smp 1 --memory 2560M --reserve-memory 512M --overprovisioned 1
    volumes:
      - scylladata:/var/lib/scylla
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 10s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 3500M

  scylla-init:
    image: scylladb/scylla:6.2
    entrypoint: ["/bin/sh", "-c"]
    command: ["cqlsh scylla 9042 -f /cql/001_create_messages.cql && cqlsh scylla 9042 -f /cql/002_create_read_states.cql && cqlsh scylla 9042 -f /cql/003_create_reactions.cql && cqlsh scylla 9042 -f /cql/004_create_pinned_messages.cql"]
    volumes:
      - ./api/cql:/cql:ro
    depends_on:
      scylla:
        condition: service_healthy
    restart: "no"

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-change-me-prod-meili-master-key}
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_EXPERIMENTAL_ENABLE_METRICS: "true"
    volumes:
      - meilidata:/meili_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kith_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kithpassword123}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/bash -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-kith_admin} $${MINIO_ROOT_PASSWORD:-kithpassword123};
      mc mb --ignore-existing local/attachments;
      mc mb --ignore-existing local/avatars;
      mc mb --ignore-existing local/emojis;
      mc mb --ignore-existing local/stickers;
      mc anonymous set public local/attachments;
      mc anonymous set download local/avatars;
      mc anonymous set download local/emojis;
      mc anonymous set download local/stickers;
      exit 0;
      "

  api:
    build:
      context: ./api
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    environment:
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-kith_prod}:${POSTGRES_PASSWORD:-kith_prod}@postgres:5432/${POSTGRES_DB:-kith_prod}?sslmode=disable
      SNOWFLAKE_NODE_ID: ${SNOWFLAKE_NODE_ID:-1}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      EVENTS_BUS: ${EVENTS_BUS:-nats}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      SCYLLA_HOSTS: ${SCYLLA_HOSTS:-scylla:9042}
      SCYLLA_KEYSPACE: ${SCYLLA_KEYSPACE:-kith}
      SCYLLA_CONSISTENCY: ${SCYLLA_CONSISTENCY:-ONE}
      MESSAGE_STORE: ${MESSAGE_STORE:-scylla}
      MESSAGES_STORE_MODE: ${MESSAGES_STORE_MODE:-scylla_only}
      API_MSG_MAX_INFLIGHT: ${API_MSG_MAX_INFLIGHT:-100}
      KLIPY_API_KEY: ${KLIPY_API_KEY:-}
      OUTBOUND_PROXY_URL: ${OUTBOUND_PROXY_URL:-}
      PG_POOL_MAX_OPEN_CONNS: ${PG_POOL_MAX_OPEN_CONNS:-25}
      PG_POOL_MAX_IDLE_CONNS: ${PG_POOL_MAX_IDLE_CONNS:-25}
      PG_POOL_MAX_LIFETIME_SEC: ${PG_POOL_MAX_LIFETIME_SEC:-300}
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY:-change-me-prod-meili-master-key}
      SEARCH_INDEXER_ENABLED: ${SEARCH_INDEXER_ENABLED:-true}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kith_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-kithpassword123}
      S3_BUCKET_ATTACHMENTS: ${S3_BUCKET_ATTACHMENTS:-attachments}
      S3_BUCKET_AVATARS: ${S3_BUCKET_AVATARS:-avatars}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://kith.moadabdou.me}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-kith.moadabdou.me}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      APP_URL: ${APP_URL:-https://kith.moadabdou.me}
      GOMEMLIMIT: ${GOMEMLIMIT:-1GiB}
      GOGC: ${GOGC:-100}
    ports:
      - "${API_PORT:-8082}:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1280M

  api-2:
    build:
      context: ./api
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    environment:
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-kith_prod}:${POSTGRES_PASSWORD:-kith_prod}@postgres:5432/${POSTGRES_DB:-kith_prod}?sslmode=disable
      SNOWFLAKE_NODE_ID: ${SNOWFLAKE_NODE_ID_2:-2}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      EVENTS_BUS: ${EVENTS_BUS:-nats}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      SCYLLA_HOSTS: ${SCYLLA_HOSTS:-scylla:9042}
      SCYLLA_KEYSPACE: ${SCYLLA_KEYSPACE:-kith}
      SCYLLA_CONSISTENCY: ${SCYLLA_CONSISTENCY:-ONE}
      MESSAGE_STORE: ${MESSAGE_STORE:-scylla}
      MESSAGES_STORE_MODE: ${MESSAGES_STORE_MODE:-scylla_only}
      API_MSG_MAX_INFLIGHT: ${API_MSG_MAX_INFLIGHT:-100}
      KLIPY_API_KEY: ${KLIPY_API_KEY:-}
      OUTBOUND_PROXY_URL: ${OUTBOUND_PROXY_URL:-}
      PG_POOL_MAX_OPEN_CONNS: ${PG_POOL_MAX_OPEN_CONNS:-25}
      PG_POOL_MAX_IDLE_CONNS: ${PG_POOL_MAX_IDLE_CONNS:-25}
      PG_POOL_MAX_LIFETIME_SEC: ${PG_POOL_MAX_LIFETIME_SEC:-300}
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY:-change-me-prod-meili-master-key}
      SEARCH_INDEXER_ENABLED: "false"
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kith_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-kithpassword123}
      S3_BUCKET_ATTACHMENTS: ${S3_BUCKET_ATTACHMENTS:-attachments}
      S3_BUCKET_AVATARS: ${S3_BUCKET_AVATARS:-avatars}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://kith.moadabdou.me}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-kith.moadabdou.me}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      APP_URL: ${APP_URL:-https://kith.moadabdou.me}
      GOMEMLIMIT: ${GOMEMLIMIT:-1GiB}
      GOGC: ${GOGC:-100}
    ports:
      - "${API2_PORT:-8083}:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1280M

  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
      target: prod
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      PORT: 4000
      CHAOS_ENABLED: ${CHAOS_ENABLED:-false}
      BUS_TYPE: ${BUS_TYPE:-nats}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      DATABASE_URL: postgres://${POSTGRES_USER:-kith_prod}:${POSTGRES_PASSWORD:-kith_prod}@postgres:5432/${POSTGRES_DB:-kith_prod}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      ERLANG_COOKIE: ${ERLANG_COOKIE:-prod-cluster-cookie}
      ERL_FLAGS: ${ERL_FLAGS:-+MBas 1024}
      VOICE_SFU_POOL: ${VOICE_SFU_POOL:-sfu:5000,sfu-2:5001}
      PRESENCE_IDLE_THRESHOLD_MS: ${PRESENCE_IDLE_THRESHOLD_MS:-120000}
    networks:
      default:
        aliases:
          - gateway-cluster
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1280M

  gateway-2:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
      target: prod
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      PORT: 4000
      CHAOS_ENABLED: ${CHAOS_ENABLED:-false}
      BUS_TYPE: ${BUS_TYPE:-nats}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      DATABASE_URL: postgres://${POSTGRES_USER:-kith_prod}:${POSTGRES_PASSWORD:-kith_prod}@postgres:5432/${POSTGRES_DB:-kith_prod}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      ERLANG_COOKIE: ${ERLANG_COOKIE:-prod-cluster-cookie}
      ERL_FLAGS: ${ERL_FLAGS:-+MBas 1024}
      VOICE_SFU_POOL: ${VOICE_SFU_POOL:-sfu:5000,sfu-2:5001}
      PRESENCE_IDLE_THRESHOLD_MS: ${PRESENCE_IDLE_THRESHOLD_MS:-120000}
    networks:
      default:
        aliases:
          - gateway-cluster
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${GATEWAY2_PORT:-4001}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1280M

  client:
    build:
      context: ./client
      target: prod
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        VITE_GATEWAY_WS: ${VITE_GATEWAY_WS:-wss://kith.moadabdou.me/ws}
        VITE_IDLE_THRESHOLD_MS: ${PRESENCE_IDLE_THRESHOLD_MS:-120000}
    ports:
      - "${CLIENT_PORT:-5173}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128M

  sfu:
    build:
      context: ./sfu
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    environment:
      PORT: 5000
      LOG_LEVEL: ${SFU_LOG_LEVEL:-warn}
      UDP_PORT_MIN: ${SFU_UDP_PORT_MIN:-50000}
      UDP_PORT_MAX: ${SFU_UDP_PORT_MAX:-50200}
      SFU_PORT_MIN: ${SFU_PORT_MIN:-${SFU_UDP_PORT_MIN:-50000}}
      SFU_PORT_MAX: ${SFU_PORT_MAX:-${SFU_UDP_PORT_MAX:-50200}}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      STUN_SERVER: ${STUN_SERVER:-}
      NAT_1TO1_IPS: ${NAT_1TO1_IPS:-${SFU_PUBLIC_IP:-51.170.129.228}}
      SFU_PUBLIC_IP: ${SFU_PUBLIC_IP:-${NAT_1TO1_IPS:-51.170.129.228}}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      SFU_PION_LOG: ${SFU_PION_LOG:-warn}
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:5000:5000"
      - "50000-50200:50000-50200/udp"
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  sfu-2:
    build:
      context: ./sfu
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    environment:
      PORT: 5001
      LOG_LEVEL: ${SFU_LOG_LEVEL:-warn}
      UDP_PORT_MIN: ${SFU2_UDP_PORT_MIN:-50300}
      UDP_PORT_MAX: ${SFU2_UDP_PORT_MAX:-50320}
      SFU_PORT_MIN: ${SFU2_UDP_PORT_MIN:-50300}
      SFU_PORT_MAX: ${SFU2_UDP_PORT_MAX:-50320}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      STUN_SERVER: ${STUN_SERVER:-}
      NAT_1TO1_IPS: ${NAT_1TO1_IPS:-${SFU_PUBLIC_IP:-51.170.129.228}}
      SFU_PUBLIC_IP: ${SFU_PUBLIC_IP:-${NAT_1TO1_IPS:-51.170.129.228}}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      SFU_PION_LOG: ${SFU_PION_LOG:-warn}
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:5001:5001"
      - "50300-50320:50300-50320/udp"
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5001/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  media-worker:
    build:
      context: ./media-worker
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-kith_prod}:${POSTGRES_PASSWORD:-kith_prod}@postgres:5432/${POSTGRES_DB:-kith_prod}?sslmode=disable
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-KITH_MEDIA}
      NATS_SUBJECT: ${NATS_SUBJECT:-kith.media.upload}
      NATS_DURABLE: ${NATS_DURABLE:-media-worker-group}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kith_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-kithpassword123}
      S3_BUCKET_ATTACHMENTS: ${S3_BUCKET_ATTACHMENTS:-attachments}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://kith.moadabdou.me}
      RAYON_NUM_THREADS: ${RAYON_NUM_THREADS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  read-states:
    build:
      context: ./read-states
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    environment:
      PORT: 8085
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SCYLLA_HOSTS: ${SCYLLA_HOSTS:-scylla:9042}
      SCYLLA_KEYSPACE: ${SCYLLA_KEYSPACE:-kith}
      DATABASE_URL: postgres://${POSTGRES_USER:-kith_prod}:${POSTGRES_PASSWORD:-kith_prod}@postgres:5432/${POSTGRES_DB:-kith_prod}?sslmode=disable
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
    ports:
      - "127.0.0.1:8085:8085"
    depends_on:
      scylla:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/8085'"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  caddy:
    profiles:
      - caddy-edge
    build:
      context: ./deploy/caddy
    image: kith-caddy:latest
    ports:
      - "${CADDY_HTTP_PORT:-8088}:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      client:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pgdata:
  redisdata:
  scylladata:
  meilidata:
  miniodata:
