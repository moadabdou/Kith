global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]
  - job_name: api-2
    static_configs:
      - targets: ["api-2:8080"]
  - job_name: gateway
    static_configs:
      - targets: ["gateway:4000"]
  - job_name: meilisearch
    bearer_token: dev-master-key
    static_configs:
      - targets: ["meilisearch:7700"]
  - job_name: sfu
    static_configs:
      - targets: ["sfu:5000"]
