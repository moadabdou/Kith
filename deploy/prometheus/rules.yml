groups:
  - name: kith-slo
    interval: 15s
    rules:
      - alert: SLOFanoutP99High
        expr: histogram_quantile(0.99, sum by (le) (rate(gateway_fanout_latency_seconds_bucket[5m]))) > 0.05
        for: 5m
        labels:
          severity: critical
          slo: fanout-p99-50ms
        annotations:
          summary: "Gateway fan-out p99 above 50ms SLO"
          description: "histogram_quantile(0.99, gateway_fanout_latency_seconds) has been > 50ms for 5m. See plan/09 §5."
          runbook: "Check gateway load, NATS lag (gateway_consumer_lag), BEAM pressure. Deliberate test: lower threshold to 0.005 to fire."

      - alert: SLOFanoutP99HighSlowBurn
        expr: histogram_quantile(0.99, sum by (le) (rate(gateway_fanout_latency_seconds_bucket[30m]))) > 0.05
        for: 30m
        labels:
          severity: warning
          slo: fanout-p99-50ms
        annotations:
          summary: "Gateway fan-out p99 slow burn above 50ms SLO"
          description: "30m-window p99 above 50ms for 30m. Same SLO, slower burn."

      - alert: SLOSendToRenderP99High
        expr: histogram_quantile(0.99, sum by (le) (rate(api_http_request_duration_seconds_bucket[5m]))) + histogram_quantile(0.99, sum by (le) (rate(gateway_fanout_latency_seconds_bucket[5m]))) > 0.15
        for: 5m
        labels:
          severity: critical
          slo: send-to-render-p99-150ms
        annotations:
          summary: "Send-to-render p99 proxy above 150ms SLO"
          description: "PROXY: api p99 + gateway fan-out p99 > 150ms for 5m. True client render is uninstrumented; this sums the two server-side segments. See plan/09 §5."
          runbook: "Check api latency panel and gateway fan-out panel to see which segment moved. Deliberate test: lower threshold to 0.01 to fire."

      - alert: SLOSendToRenderP99HighSlowBurn
        expr: histogram_quantile(0.99, sum by (le) (rate(api_http_request_duration_seconds_bucket[30m]))) + histogram_quantile(0.99, sum by (le) (rate(gateway_fanout_latency_seconds_bucket[30m]))) > 0.15
        for: 30m
        labels:
          severity: warning
          slo: send-to-render-p99-150ms
        annotations:
          summary: "Send-to-render p99 proxy slow burn above 150ms SLO"
          description: "30m-window proxy above 150ms for 30m."

  - name: kith-slo-burn-rate
    interval: 15s
    rules:
      # API Availability SLO (Target: 99.9%, Error Budget: 0.1% = 0.001)
      # Multi-window multi-burn-rate alerting (Google SRE Workbook Ch 5):
      # - Fast burn: 2% budget consumed over 1h -> burn rate 14.4 (1h window + 5m short window)
      # - Slow burn: 5% budget consumed over 6h -> burn rate 6.0 (6h window + 30m short window)
      - record: job:api_requests:rate5m
        expr: sum(rate(api_http_requests_total[5m]))
      - record: job:api_errors:rate5m
        expr: sum(rate(api_http_requests_total{code=~"5.."}[5m]))
      - record: job:api_burn_rate:5m
        expr: (job:api_errors:rate5m / clamp_min(job:api_requests:rate5m, 0.001)) / 0.001

      - record: job:api_requests:rate30m
        expr: sum(rate(api_http_requests_total[30m]))
      - record: job:api_errors:rate30m
        expr: sum(rate(api_http_requests_total{code=~"5.."}[30m]))
      - record: job:api_burn_rate:30m
        expr: (job:api_errors:rate30m / clamp_min(job:api_requests:rate30m, 0.001)) / 0.001

      - record: job:api_requests:rate1h
        expr: sum(rate(api_http_requests_total[1h]))
      - record: job:api_errors:rate1h
        expr: sum(rate(api_http_requests_total{code=~"5.."}[1h]))
      - record: job:api_burn_rate:1h
        expr: (job:api_errors:rate1h / clamp_min(job:api_requests:rate1h, 0.001)) / 0.001

      - record: job:api_requests:rate6h
        expr: sum(rate(api_http_requests_total[6h]))
      - record: job:api_errors:rate6h
        expr: sum(rate(api_http_requests_total{code=~"5.."}[6h]))
      - record: job:api_burn_rate:6h
        expr: (job:api_errors:rate6h / clamp_min(job:api_requests:rate6h, 0.001)) / 0.001

      - alert: SLOApiAvailabilityBudgetFastBurn
        expr: (job:api_burn_rate:1h > 14.4) and (job:api_burn_rate:5m > 14.4)
        for: 2m
        labels:
          severity: critical
          slo: api-availability-99.9
        annotations:
          summary: "API Availability SLO fast burn: 2% of budget consumed over 1h"
          description: "API 5xx error rate is burning 30-day error budget at 14.4x rate across both 1h and 5m windows (>2% budget burn in 1 hour)."
          runbook: "Check API pod health, PostgreSQL error logs, and downstream dependency saturation."

      - alert: SLOApiAvailabilityBudgetSlowBurn
        expr: (job:api_burn_rate:6h > 6.0) and (job:api_burn_rate:30m > 6.0)
        for: 15m
        labels:
          severity: warning
          slo: api-availability-99.9
        annotations:
          summary: "API Availability SLO slow burn: 5% of budget consumed over 6h"
          description: "API 5xx error rate is burning 30-day error budget at 6.0x rate across both 6h and 30m windows (>5% budget burn in 6 hours)."
          runbook: "Check slow leak errors, pool exhaustion warnings, and intermittent timeout trends."

  - name: kith-egress
    interval: 30s
    rules:
      - record: sfu:egress_monthly_bytes_projected
        expr: sum(rate(sfu_packets_forwarded_total[5m])) * 1200 * 2592000

      - alert: EgressMonthlyProjectionHigh
        expr: sfu:egress_monthly_bytes_projected > 7e12
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "SFU monthly egress projection above 7 TB"
          description: "Projected monthly egress (5m rate x 1200 B/pkt x 30d) above 7 TB for 15m. Assumption: ~1200 B avg RTP packet (postmortems/phase-6.md §8.1). Replaces screen-share quota idea per #84."
