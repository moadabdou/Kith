# ==============================================================================
# Nginx Ingress Configuration for kith.moadabdou.me
# Location on Oracle Cloud VM: /home/ubuntu/primary_portfolio/nginx.conf
# ==============================================================================

upstream kith_api_upstream {
    server host.docker.internal:8082 max_fails=3 fail_timeout=10s;
    server host.docker.internal:8083 backup;
}

upstream kith_gateway_upstream {
    server host.docker.internal:4000 max_fails=3 fail_timeout=10s;
    server host.docker.internal:4001 backup;
}

upstream kith_client_upstream {
    server host.docker.internal:5173 max_fails=3 fail_timeout=10s;
}

upstream kith_minio_upstream {
    server host.docker.internal:9000 max_fails=3 fail_timeout=10s;
}

# HTTP 80 Virtual Host for kith.moadabdou.me
server {
    listen 80;
    server_name kith.moadabdou.me;

    # Handle dummy Cloudflare CDN checks gracefully without error
    location /cdn-cgi {
        return 204;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 443 Virtual Host for kith.moadabdou.me
server {
    listen 443 ssl;
    server_name kith.moadabdou.me;

    # SSL Certificates (Cloudflare Origin)
    ssl_certificate /etc/nginx/ssl/moadabdou_chain.crt;
    ssl_certificate_key /etc/nginx/ssl/moadabdou.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Media uploads limit (Issue #132: 50MB)
    client_max_body_size 50m;

    # Handle dummy Cloudflare CDN checks gracefully
    location /cdn-cgi {
        return 204;
    }

    # Gateway WebSocket connection
    location = /ws {
        proxy_pass http://kith_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Keep persistent WS connection open without premature timeouts
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Go API endpoints
    location /api/ {
        proxy_pass http://kith_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Avatars, Emojis, Stickers, Attachments (served directly from / uploaded to MinIO object storage)
    location ~* ^/(avatars|emojis|stickers|attachments)/ {
        proxy_pass http://kith_minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=86400";
    }

    # Client SPA
    location / {
        proxy_pass http://kith_client_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
