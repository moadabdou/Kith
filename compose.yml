name: kith

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-discord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discord}
      POSTGRES_DB: ${POSTGRES_DB:-discord}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - -path
      - /migrations
      - -database
      - postgres://${POSTGRES_USER:-discord}:${POSTGRES_PASSWORD:-discord}@postgres:5432/${POSTGRES_DB:-discord}?sslmode=disable
      - up
    volumes:
      - ./api/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: postgres:17-alpine
    command:
      - psql
      - postgres://${POSTGRES_USER:-discord}:${POSTGRES_PASSWORD:-discord}@postgres:5432/${POSTGRES_DB:-discord}?sslmode=disable
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /seed.sql
    volumes:
      - ./api/db/seed.sql:/seed.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["--js", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  scylla:
    image: scylladb/scylla:6.2
    command: --smp 1 --memory 1G --overprovisioned 1
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - scylladata:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 10s
      timeout: 5s
      retries: 15

  scylla-init:
    image: scylladb/scylla:6.2
    entrypoint: ["/bin/sh", "-c"]
    command: ["cqlsh scylla 9042 -f /cql/001_create_messages.cql"]
    volumes:
      - ./api/cql:/cql:ro
    depends_on:
      scylla:
        condition: service_healthy
    restart: "no"

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
      MEILI_ENV: development
      MEILI_EXPERIMENTAL_ENABLE_METRICS: "true"
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    environment:
      PORT: ${API_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-discord}:${POSTGRES_PASSWORD:-discord}@postgres:5432/${POSTGRES_DB:-discord}?sslmode=disable
      SNOWFLAKE_NODE_ID: ${SNOWFLAKE_NODE_ID:-1}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      EVENTS_BUS: ${EVENTS_BUS:-nats}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      SCYLLA_HOSTS: ${SCYLLA_HOSTS:-scylla:9042}
      SCYLLA_KEYSPACE: ${SCYLLA_KEYSPACE:-kith}
      SCYLLA_CONSISTENCY: ${SCYLLA_CONSISTENCY:-ONE}
      MESSAGE_STORE: ${MESSAGE_STORE:-scylla}
      MESSAGES_STORE_MODE: ${MESSAGES_STORE_MODE:-scylla_only}
      PPROF_PORT: ${PPROF_PORT:-6060}
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
      SEARCH_INDEXER_ENABLED: ${SEARCH_INDEXER_ENABLED:-true}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6060:6060"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${API_PORT:-8080}/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-2:
    build:
      context: ./api
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    environment:
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-discord}:${POSTGRES_PASSWORD:-discord}@postgres:5432/${POSTGRES_DB:-discord}?sslmode=disable
      SNOWFLAKE_NODE_ID: ${SNOWFLAKE_NODE_ID_2:-2}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      EVENTS_BUS: ${EVENTS_BUS:-nats}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      SCYLLA_HOSTS: ${SCYLLA_HOSTS:-scylla:9042}
      SCYLLA_KEYSPACE: ${SCYLLA_KEYSPACE:-kith}
      SCYLLA_CONSISTENCY: ${SCYLLA_CONSISTENCY:-ONE}
      MESSAGE_STORE: ${MESSAGE_STORE:-scylla}
      MESSAGES_STORE_MODE: ${MESSAGES_STORE_MODE:-scylla_only}
      PPROF_PORT: 6061
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
      SEARCH_INDEXER_ENABLED: "false"
    ports:
      - "127.0.0.1:${API2_PORT:-8081}:8080"
      - "127.0.0.1:${API2_PPROF_PORT:-6061}:6061"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ./gateway
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    # Issue #88 Step 3: BEAM needs FD headroom per connection (socket +
    # session + monitors). Docker default here is 2048, which emfile-crashed
    # Bandit acceptors at ~2k conns/node. 65536 covers the 50k army with margin.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      PORT: ${GATEWAY_PORT:-4000}
      CHAOS_ENABLED: ${CHAOS_ENABLED:-true}
      BUS_TYPE: ${BUS_TYPE:-nats}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      DATABASE_URL: postgres://${POSTGRES_USER:-discord}:${POSTGRES_PASSWORD:-discord}@postgres:5432/${POSTGRES_DB:-discord}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      ERLANG_COOKIE: ${ERLANG_COOKIE:-dev-cluster-cookie}
      # Phase 7d (Issue #87): channel-assigned SFU pool. Comma-separated
      # WS endpoints; gateway hashes channel_id -> one of them. Service
      # names (not 127.0.0.1): the gateway's out-of-band health poller runs
      # INSIDE this container, where 127.0.0.1 is itself — `sfu`/`sfu-2`
      # resolve over the compose network. Browsers rewrite these hosts to
      # the page hostname (sfu-client.ts); host-network drivers map them to
      # 127.0.0.1. Unset = legacy single endpoint (127.0.0.1:5000).
      VOICE_SFU_POOL: ${VOICE_SFU_POOL:-sfu:5000,sfu-2:5001}
      # Observation override (default/spec is 10 min, plan/05 §1)
      PRESENCE_IDLE_THRESHOLD_MS: ${PRESENCE_IDLE_THRESHOLD_MS:-120000}
    networks:
      default:
        aliases:
          - gateway-cluster
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${GATEWAY_PORT:-4000}/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway-2:
    build:
      context: ./gateway
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    # Same FD headroom as gateway (see above): emfile wall at ~2k conns/node.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      PORT: 4000
      CHAOS_ENABLED: ${CHAOS_ENABLED:-true}
      BUS_TYPE: ${BUS_TYPE:-nats}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      DATABASE_URL: postgres://${POSTGRES_USER:-discord}:${POSTGRES_PASSWORD:-discord}@postgres:5432/${POSTGRES_DB:-discord}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      ERLANG_COOKIE: ${ERLANG_COOKIE:-dev-cluster-cookie}
      VOICE_SFU_POOL: ${VOICE_SFU_POOL:-sfu:5000,sfu-2:5001}
      PRESENCE_IDLE_THRESHOLD_MS: ${PRESENCE_IDLE_THRESHOLD_MS:-120000}
    networks:
      default:
        aliases:
          - gateway-cluster
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY2_PORT:-4001}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  client:
    build:
      context: ./client
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    environment:
      VITE_API_BASE: /api
      # Observation override — must match the gateway's PRESENCE_IDLE_THRESHOLD_MS
      VITE_IDLE_THRESHOLD_MS: ${PRESENCE_IDLE_THRESHOLD_MS:-120000}
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10

  sfu:
    build:
      context: ./sfu
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    environment:
      PORT: ${SFU_PORT:-5000}
      LOG_LEVEL: ${SFU_LOG_LEVEL:-debug}
      UDP_PORT_MIN: ${SFU_UDP_PORT_MIN:-50000}
      UDP_PORT_MAX: ${SFU_UDP_PORT_MAX:-50020}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      STUN_SERVER: ${STUN_SERVER:-}
      NAT_1TO1_IPS: ${NAT_1TO1_IPS:-127.0.0.1}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      SFU_PION_LOG: ${SFU_PION_LOG:-warn}
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:5000:5000"
      - "50000-50020:50000-50020/udp"
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${SFU_PORT:-5000}/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Phase 7d (Issue #87): second SFU for channel-assigned pooling. Disjoint
  # UDP range + WS port; the gateway hashes channel_id -> endpoint
  # (VOICE_SFU_POOL) so a channel never splits across instances.
  # NOTE: plan/10 specifies UDP 40000-40100 while compose uses 50000+; the
  # ranges here stay consistent with the existing sfu service — reconciling
  # with plan/10 (firewall + deploy docs) is a separate deploy task.
  sfu-2:
    build:
      context: ./sfu
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    environment:
      PORT: ${SFU2_PORT:-5001}
      LOG_LEVEL: ${SFU_LOG_LEVEL:-debug}
      UDP_PORT_MIN: ${SFU2_UDP_PORT_MIN:-50100}
      UDP_PORT_MAX: ${SFU2_UDP_PORT_MAX:-50120}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      STUN_SERVER: ${STUN_SERVER:-}
      NAT_1TO1_IPS: ${NAT_1TO1_IPS:-127.0.0.1}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      SFU_PION_LOG: ${SFU_PION_LOG:-warn}
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:5001:5001"
      - "50100-50120:50100-50120/udp"
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${SFU2_PORT:-5001}/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      api-2:
        condition: service_healthy
      client:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.7.2
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/provisioning/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/provisioning/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  grafana-data:
  redisdata:
  scylladata:
  meilidata:
